{ParcelTrackingURL(
	when: "{ParcelCount} == 1",
	before: '<button class="small-expand" href="',
	after: '" target="_blank" rel="nofollow"><span>{%TrackOrder}</span></button><spacer size="10"></spacer>'
)}
{ParcelTrackingURL(
	when: "{ParcelCount} > 1",
	before: '<button class="small-expand" href="',
	after: '" target="_blank" rel="nofollow"><span>{%TrackOrder} ({%Parcel} {ParcelNumber})</span></button><spacer size="10"></spacer>'
)}
